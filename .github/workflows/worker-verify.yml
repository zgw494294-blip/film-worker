name: Worker platform verification
on:
  pull_request:
  workflow_dispatch:
    inputs:
      bundle_ref:
        description: Git tag or commit to package and verify
        type: string
      published_release:
        description: GitHub release tag whose uploaded installation packages should be tested
        type: string

permissions:
  contents: read

jobs:
  build-distribution:
    if: ${{ !inputs.published_release }}
    timeout-minutes: 25
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        target: [macos-arm64, windows-x86_64]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.bundle_ref || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install uv==0.13.7
      - run: uv run --locked python scripts/build_media_tools.py --target ${{ matrix.target }}
      - run: uv run --locked python scripts/build_portable.py --target ${{ matrix.target }} --tools dist/media-tools/${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        with:
          name: worker-${{ matrix.target }}
          path: dist/电影复刻执行端-${{ matrix.target }}.zip*
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

  verify:
    needs: build-distribution
    if: ${{ !cancelled() && (needs.build-distribution.result == 'success' || (needs.build-distribution.result == 'skipped' && inputs.published_release)) }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: macos-arm64
          - os: windows-2025
            target: windows-x86_64
    runs-on: ${{ matrix.os }}
    env:
      BUNDLE_PATH: ${{ inputs.published_release && format('dist/film-worker-{0}-{1}.zip', inputs.published_release, matrix.target) || format('dist/电影复刻执行端-{0}.zip', matrix.target) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install uv==0.13.7
      - name: Exercise protocol, process ownership, and signed releases
        env:
          FILM_WORKER_TEST_RELEASE: "1"
          FILM_WORKER_TEST_LOGIN: "1"
        run: uv run --locked python -m unittest discover -s tests -v
      - uses: actions/download-artifact@v8
        id: built
        if: ${{ !cancelled() && !inputs.published_release }}
        with:
          name: worker-${{ matrix.target }}
          path: dist
      - name: Download the published installation package and its checksum
        id: published
        if: ${{ !cancelled() && inputs.published_release }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.published_release }}
        shell: bash
        run: gh release download --repo "$GITHUB_REPOSITORY" --dir dist --pattern "${BUNDLE_PATH##*/}*" -- "$RELEASE_TAG"
      - name: Exercise offline installation and the installed panel on Mac
        if: ${{ !cancelled() && runner.os == 'macOS' && (steps.built.outcome == 'success' || steps.published.outcome == 'success') }}
        run: uv run --locked python scripts/verify_portable.py "$BUNDLE_PATH"
      - name: Prepare pinned Blender and Codex for native Windows verification
        id: windows_tools
        if: ${{ !cancelled() && runner.os == 'Windows' && (steps.built.outcome == 'success' || steps.published.outcome == 'success') }}
        shell: pwsh
        run: |
          $toolRoot = Join-Path $env:RUNNER_TEMP film-worker-test-tools
          New-Item -ItemType Directory -Path $toolRoot | Out-Null
          function Expand-PinnedTool($name, $url, $sha256) {
            $archive = Join-Path $toolRoot "$name.zip"
            curl.exe --fail --location --retry 3 --max-time 360 --output $archive $url
            if ($LASTEXITCODE -ne 0 -or (Get-FileHash -Path $archive -Algorithm SHA256).Hash -ne $sha256) {
              throw "Download or checksum failed for $name"
            }
            Expand-Archive -LiteralPath $archive -DestinationPath (Join-Path $toolRoot $name)
          }
          Expand-PinnedTool blender 'https://download.blender.org/release/Blender5.2/blender-5.2.3-windows-x64.zip' '723f08a4401502561eb763cdeacf8745b31e5f3f154d287d3830d97cf75dc2fb'
          Expand-PinnedTool codex 'https://github.com/openai/codex/releases/download/rust-v0.169.1/codex-x86_64-pc-windows-msvc.exe.zip' '4214bf9790525aae9f9393c8e8ffa229be0454f9fa2ce103b4cb2012ad74bc40'
          $blender = Get-ChildItem -Path (Join-Path $toolRoot blender) -File -Filter blender.exe -Recurse | Select-Object -First 1
          $codex = Get-ChildItem -Path (Join-Path $toolRoot codex) -File -Recurse |
            Where-Object { $_.Name -in @('codex.exe', 'codex-x86_64-pc-windows-msvc.exe') } | Select-Object -First 1
          if (!$blender -or !$codex) { throw 'Could not locate the native Windows tools' }
          "FILM_TEST_BLENDER=$($blender.FullName)" | Add-Content -Path $env:GITHUB_ENV -Encoding utf8
          "FILM_TEST_CODEX=$($codex.FullName)" | Add-Content -Path $env:GITHUB_ENV -Encoding utf8
      - name: Verify offline installation, 1080p review, and 1080p and 4K export on Windows
        if: ${{ !cancelled() && steps.windows_tools.outcome == 'success' }}
        run: uv run --locked python scripts/verify_portable.py "$env:BUNDLE_PATH" --simulate
