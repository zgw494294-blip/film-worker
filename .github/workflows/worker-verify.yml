name: Worker platform verification
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: macos-arm64
          - os: windows-2025
            target: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install uv==0.13.7
      - name: Exercise protocol, process ownership, and signed releases
        env:
          FILM_WORKER_TEST_RELEASE: "1"
        run: uv run --locked python -m unittest discover -s tests -v
      - name: Build local platform distribution
        run: uv run --locked python scripts/build_portable.py --target ${{ matrix.target }}
      - name: Install twice with offline resolution and exercise the installed panel
        run: uv run --locked python scripts/verify_portable.py "dist/电影复刻执行端-${{ matrix.target }}.zip"
