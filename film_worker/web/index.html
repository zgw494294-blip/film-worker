<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>电影复刻执行端</title><link rel="stylesheet" href="/panel.css"></head>
<body>
<main>
<header><div><h1>电影复刻执行端</h1><p id="address"></p></div><span id="connection" role="status">读取中</span></header>
<section aria-labelledby="jobs-title">
<div class="row"><h2 id="jobs-title">制作工单</h2><div class="actions">
<button data-control="start">启动节点</button><button data-control="drain">暂停领单</button>
<button data-control="resume">恢复领单</button><button data-control="stop">停止节点</button></div></div>
<p id="capacity"></p><ul id="jobs"></ul>
<details><summary>近期记录</summary><ul id="history"></ul></details>
</section>
<form id="form">
<div class="row"><h2>节点配置</h2><button type="button" data-control="probe">检测本机工具</button></div>
<fieldset><legend>连接</legend><div class="grid">
<label>服务地址<input name="server" placeholder="https://workbench.example.com"></label>
<label>节点标识<input name="node_key" autocomplete="off"></label>
<label>显示名称<input name="display_name"></label>
<label>建模 Token<input name="token" type="password" placeholder="留空沿用已保存的 Token" autocomplete="new-password"></label>
</div></fieldset>
<fieldset><legend>并发和渲染</legend><div class="grid">
<label>总工单<input name="slots" type="number" min="1" max="128" required></label>
<label>Codex 进程<input name="model_slots" type="number" min="1" max="128" required></label>
<label>Blender 进程<input name="render_slots" type="number" min="1" max="128" required></label>
<label>传输并发<input name="transfer_slots" type="number" min="1" max="128" required></label>
<label>单次渲染线程<input name="cpu_threads" type="number" min="1" max="128" required></label>
<label>预留磁盘 GiB<input name="disk_reserve_gib" type="number" min="1" max="128" required></label>
<label>设备<select name="render_backend"><option>auto</option><option>cpu</option><option>metal</option><option>cuda</option><option>optix</option><option>hip</option><option>oneapi</option></select></label>
</div></fieldset>
<details open><summary>模型与制作档案</summary>
<p>粘贴服务端冻结的档案数组。模型、推理强度和工作流程由档案指定。</p>
<div class="grid model">
<label>当前档案<select id="profile-choice"></select></label>
<label>服务商<input id="codex-provider"></label>
<label>模型<input id="codex-model"></label>
<label>推理强度<input id="codex-effort"></label>
</div>
<div class="actions"><button id="draft-model" type="button">生成修改后的档案</button>
<button id="test-model" type="button">测试已保存模型</button></div>
<label>制作档案 JSON<textarea name="profiles" rows="7" spellcheck="false"></textarea></label>
</details>
<details><summary>工具路径</summary><div class="grid">
<label>Codex CLI<input name="codex"></label><label>Blender<input name="blender"></label>
<label>FFmpeg<input name="ffmpeg"></label><label>FFprobe<input name="ffprobe"></label>
</div></details>
<details><summary>Git 更新</summary>
<div class="grid">
<label>Git 仓库<input name="update_remote" placeholder="https://…"></label>
<label>发布标签<input name="update_tag"></label>
<label>可信公钥文件<input name="update_signers" placeholder="allowed_signers 的本机绝对路径"></label>
<label>检查间隔（分钟）<input name="update_interval_minutes" type="number" min="1" max="1440" required></label>
</div>
<label class="toggle"><input name="auto_update" type="checkbox">启用自动更新</label>
<div class="actions"><button type="button" data-control="update">检查并更新</button>
<button type="button" data-control="rollback">回退上个版本</button></div>
<p id="update-status"></p></details>
<footer><button type="submit">保存配置</button><output id="notice" aria-live="polite"></output></footer>
</form>
</main>
<script src="/panel.js"></script></body></html>
